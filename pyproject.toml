[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umlscope"
version = "0.1.0"
description = "Drill-down architecture viewer for Python projects, colored by CRAP scores (reads crapper's .metrics/crap.edn)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
umlscope = "umlscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/umlscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
